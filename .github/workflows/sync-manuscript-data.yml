name: Synchronize manuscript evaluation data

on:
  push:
    paths:
      - '.github/workflows/sync-manuscript-data.yml'

permissions:
  contents: write

concurrency:
  group: manuscript-data-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'tomatot3/Structure-Generation-of-Interlocking-Floral-Patterns'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download prepared manuscript data
        run: |
          curl --fail --location --retry 3 --max-time 180 'https://attempt-phone-dining-atomic.trycloudflare.com/repository_updates.zip' --output /tmp/repository_updates.zip
          curl --fail --location --retry 3 --max-time 600 'https://attempt-phone-dining-atomic.trycloudflare.com/experiment.zip' --output /tmp/PaperA_Experiment_Reproduction_Data_upload.zip
      - name: Apply and check evaluation records
        run: |
          python - <<'PY'
          import zipfile,json,math
          from pathlib import Path,PurePosixPath
          prefix='data/evaluation/human_and_cases/'
          with zipfile.ZipFile('/tmp/repository_updates.zip') as z:
              assert len(z.namelist())==18
              for name in z.namelist():
                  p=PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert name.startswith(prefix) or name in ['README.md','docs/DATA_DICTIONARY.md','reproduction/main_results.json']
              z.extractall('.')
          root=Path(prefix)
          summary=json.loads(Path('reproduction/main_results.json').read_text())
          expected={'A1':4.529629629629629,'A2':4.518518518518518,'B1':4.546666666666667,'C1':4.806666666666667}
          for name,metrics,count in [('D1_structure_ratings.json',['A1','A2'],270),('D3_render_ratings.json',['B1','C1'],150)]:
              rows=json.loads((root/name).read_text())
              assert len(rows)==count
              assert len({r['evaluator'] for r in rows})==5
              for metric in metrics:
                  mean=sum(r[metric] for r in rows)/len(rows)
                  assert abs(mean-expected[metric])<1e-12
                  assert abs(mean-summary['ratings'][name]['mean'][metric])<1e-12
          assert json.loads((root/'D2_structure_comments.json').read_text())==[]
          agreement=json.loads((root/'D7_rating_agreement.json').read_text())
          for metric,alpha in {'A1':.8223,'A2':.8005,'B1':.8355,'C1':.8302}.items():
              assert round(agreement['metrics'][metric]['alpha'],4)==alpha
          assert len(json.loads((root/'D8_weight_sensitivity/settings.json').read_text()))==13
          with zipfile.ZipFile('/tmp/PaperA_Experiment_Reproduction_Data_upload.zip') as z:
              for name in ['D1_structure_ratings.json','D2_structure_comments.json','D3_render_ratings.json','D7_rating_agreement.json']:
                  assert json.loads(z.read(prefix+name))==json.loads((root/name).read_text())
              assert json.loads(z.read('reproduction/main_results.json'))==summary
              assert len([n for n in z.namelist() if n.startswith('data/comparison_contexts/') and n.endswith('shared_stage4_inventory.json')])==108
          print('Published inputs match the manuscript: 54 structures, 30 renderings, five evaluators; D2 empty; D7 and D8 included.')
          PY
      - name: Commit synchronized data and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/DATA_DICTIONARY.md reproduction/main_results.json data/evaluation/human_and_cases
          git rm .github/workflows/sync-manuscript-data.yml
          git commit -m "Synchronize manuscript evaluation data"
          git push origin HEAD:main
      - name: Replace the experiment archive and release reference
        run: |
          old_name='PaperA_Experiment_Reproduction_Data_v1.0.0.zip'
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/assets/576457188 --jq .name)" = "$old_name"
          gh release upload v1.0.0 /tmp/PaperA_Experiment_Reproduction_Data_upload.zip --repo "$GITHUB_REPOSITORY"
          new_id="$(gh api repos/$GITHUB_REPOSITORY/releases/392367307/assets --jq '.[] | select(.name == "PaperA_Experiment_Reproduction_Data_upload.zip" and .state == "uploaded") | .id')"
          test -n "$new_id"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/576457188"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$new_id" -f name="$old_name" --silent
          commit="$(git rev-parse HEAD)"
          git tag -f v1.0.0 "$commit"
          git push origin refs/tags/v1.0.0 --force
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/392367307" -f target_commitish="$commit" --silent
          gh api "repos/$GITHUB_REPOSITORY/releases/392367307/assets" --jq '.[] | [.name,.size,.state] | @tsv'
