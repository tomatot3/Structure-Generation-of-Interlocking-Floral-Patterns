<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>外观编辑</title><link rel="stylesheet" href="style.css?v=vessels-20261029"><script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js"}}</script><body>
<header><nav><button data-mode="plan">方案</button><button data-mode="recover">分组</button><button data-mode="edit" class="active">编辑</button><button data-mode="deliver">交付</button></nav><span id="status">读取项目…</span></header>
<div class="topbar"><div><button id="undo">撤销</button><button id="redo">重做</button><button id="reset">还原修改</button><label id="structureLabel"><input type="checkbox" id="structure"> 结构与外观对照</label></div><div><button id="save">保存项目</button><label class="button">打开项目<input type="file" id="loadProject" accept=".json" hidden></label><button id="applyVessel">器型应用</button><button id="export" class="primary">导出设计</button></div></div>
<main><aside><section id="objectPanel"><h3>构成对象</h3><div id="objects"></div></section>
<section id="planPanel" hidden><h3>结构方案</h3><label class="button block">导入结构方案<input id="structureInput" type="file" accept=".json,.zip" hidden></label><p class="help" id="appearanceState"></p><h3>外观要求</h3><textarea id="style" rows="5">青花花叶，白底，清晰的装饰轮廓。保留主藤连续走势与花位连接。</textarea><button id="condition" class="primary block">导出渲染条件</button><label>生成结果对应的结构<select id="renderInputVersion"></select></label><img id="renderInputPreview" hidden><p id="renderInputNote" class="help"></p><label id="imageImportLabel" class="button block">导入生成结果<input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp" hidden></label><label>生成记录<input id="generationNote" placeholder="模型、实际提示或生成记录位置"></label><details><summary>查看结构提示</summary><pre id="prompt"></pre></details><details><summary>该外观的实际生成记录</summary><p id="recordInfo" class="help"></p><img id="actualInput" style="width:100%" hidden><pre id="actualPrompt" style="max-height:280px;overflow:auto;white-space:pre-wrap"></pre></details><p class="help">将条件包用于外观生成，再导入单个重复单元。</p></section>
<section id="recoverPanel" hidden><h3>校正归属</h3><label>检查对象<select id="recoverObject"></select></label><p class="help">在原图上整理片段。已调整的枝形、花头和删减会保留。</p><label><input type="checkbox" id="brush"> 归属画笔</label><label>画笔宽度 <input id="brushSize" type="range" min="6" max="40" value="16"></label><button id="clearBrush" class="block">清除本次涂选</button><p id="selectionNote" class="help"></p><label>归入对象<select id="assignTarget"></select></label><button id="assignRegion" class="block">归入所选对象</button><button id="unknownRegion" class="block">暂不归属</button><details><summary>新建、合并与挂接</summary><label>新对象名称<input id="newObjectName" placeholder="例如：右上叶饰"></label><label>依附对象<select id="parentTarget"></select></label><button id="newRegion" class="block">将涂选部分新建为叶饰</button><button id="reparent" class="block">纠正当前对象的依附记录</button><button id="mergeObject" class="block">将当前对象整体并入归入对象</button></details><details id="alignmentTools"><summary>结构配准</summary><p class="help">拖动配准点使结构贴合原图，再重新分组。</p><button id="recover" class="block">按配准重新分组</button></details><button id="undoRegion" class="block">撤销上一次归属校正</button><button id="continueEditing" class="primary block">继续编辑设计</button></section>
<section id="editPanel"><h3 id="selectedTitle">对象</h3><div id="flowerControls" hidden><label>花头大小 <input id="flowerScale" type="range" min="75" max="125" value="100"><output id="scaleLabel">100%</output></label><label>替换花头<select id="flowerAsset"><option value="">原花头</option><option value="flower1">花头1</option><option value="flower2">花头2</option></select></label><label><input id="unlockFlower" type="checkbox"> 调整花位</label></div><div id="leafControls" hidden><label>叶饰大小 <input id="leafScale" type="range" min="80" max="120" value="100"><output id="leafScaleLabel">100%</output></label><label>替换叶饰<select id="leafAsset"><option value="">原叶饰</option><option value="leaf1">叶饰1</option><option value="leaf2">叶饰2</option></select></label></div><div id="branchControls" hidden><button id="delete" class="block">移除对象</button><button id="restore" class="block">恢复对象</button></div><p id="editHelp" class="help"></p></section>
<section id="deliverPanel" hidden><h3>连续边饰</h3><label>带高（mm）<input id="bandHeight" type="number" min="5" max="500" value="50"></label><label>重复单元数<input id="repeatCount" type="number" min="1" max="24" value="3"></label><p class="help" id="bandSize"></p><button id="showCup" class="primary block">器型应用 · 3D</button><button id="showSeam" class="block">查看外观接缝</button><button id="seam" class="block">调整重复接缝</button><p class="help">两侧端点和切向联动，修改在各周期同步。</p><button id="downloadSvg" class="block">下载可编辑SVG</button><button id="downloadRepeat" class="block">下载连续SVG</button><button id="downloadPng" class="block">下载PNG预览</button></section><details id="versionPanel"><summary>版本与对照</summary><input id="versionName" placeholder="版本名称"><button id="saveVersion" class="block">保存设计版本</button><select id="versionList"></select><button id="compareVersion" class="block">与当前设计对照</button><button id="openVersion" class="block">载入选中版本</button></details><details id="sourcePanel"><summary>来源与设计任务</summary><label>来源<input id="source" placeholder="文献、页码或藏品"></label><label>采用的构成解释<textarea id="interpretation" rows="3"></textarea></label><label>设计任务<textarea id="task" rows="3"></textarea></label><button id="saveSource" class="block">保存来源与任务</button></details></aside>
<div class="work"><div class="canvases"><div class="board" id="guideBoard" hidden><div class="boardTitle" id="guideTitle">结构</div><div id="guideView"></div></div><div class="board" id="artBoard"><div class="boardTitle" id="artTitle">设计</div><div id="stage"><img id="raster"  hidden><div id="art"></div><svg id="overlay" viewBox="0 0 695 724"></svg></div></div></div><div id="repeat"></div></div></main><div id="toast"></div><script src="curve_controls.js?v=periodic-20261008-2"></script><dialog id="compareModal"><button id="closeCompare">关闭对照</button><div class="comparison"><figure><figcaption>已保存版本</figcaption><img id="compareOriginal"></figure><figure><figcaption>当前设计</figcaption><div id="compareCurrent"></div></figure></div></dialog><dialog id="seamDialog"><div class="dialogHead"><div><h2>连续接缝</h2><p id="seamSize" class="help"></p></div><button id="closeSeam">关闭</button></div><div class="seamTools"><label>查看范围 <input id="seamWidth" type="range" min="40" max="200" value="100"></label><label><input id="seamLine" type="checkbox" checked> 接缝线</label><label><input id="seamHighlight" type="checkbox"> 标出所选对象</label><label><input id="seamFullHeight" type="checkbox"> 整幅高度</label></div><div class="seamComparison"><figure><figcaption>单元右侧</figcaption><div id="seamRight"></div></figure><figure><figcaption>单元左侧</figcaption><div id="seamLeft"></div></figure><figure class="joined"><figcaption>相邻单元拼接</figcaption><div id="seamView"></div></figure></div><p class="help">点击枝叶可返回编辑；同一对象在各重复单元中同步更新。</p></dialog><dialog id="cupDialog"><div class="dialogHead"><h2>器型应用</h2><button id="closeCup">返回编辑</button></div><div class="vesselLayout"><div class="vesselControls"><label>器型<select id="vesselKind"><option value="plate">宽沿瓷盘</option><option value="bowl">敞口碗</option><option value="cup">直身杯</option></select></label><label>搭配纹样<select id="vesselMotif"><option value="dragon">海水龙纹</option><option value="none">留白</option></select></label><label>边饰重复 <output id="vesselRepeatsValue">8</output><input id="vesselRepeats" type="range" min="2" max="16" step="1" value="8"></label><label>边饰宽度 <output id="vesselBandValue">15%</output><input id="vesselBand" type="range" min="8" max="24" step="1" value="15"></label><label>靠近边缘 <input id="vesselPosition" type="range" min="0" max="100" value="85"></label><p class="help">拖动旋转，滚轮缩放。边饰采用当前编辑结果。</p></div><div class="vesselStage"><div id="cupViewer" title="拖动旋转，滚轮缩放"></div><div class="cupTools"><select id="cupView" aria-label="查看角度"><option value="front">整体</option><option value="low">低角度</option><option value="top">俯视</option></select><button data-cup-format="png">保存图片</button><button data-cup-format="glb">下载模型</button></div></div></div><div id="cupStatus" role="status" aria-live="polite"></div></dialog><script src="app.js?v=periodic-20261008-2"></script><script src="workflow_ui.js?v=periodic-20261008-2"></script><script src="cup_ui.js?v=vessels-20261029-motifs3"></script></body></html>
